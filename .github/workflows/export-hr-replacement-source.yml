name: Temporary HR replacement source export
on:
  push:
    branches:
      - work/hr-replacement-source-export
    paths:
      - .github/workflows/export-hr-replacement-source.yml
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Archive the HR replacement source and QA specifications
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=zip --output="$RUNNER_TEMP/hr-replacement-source.zip" HEAD ci docs/hr-replacement .github/workflows/erp-16-1-98-production-build.yml
          unzip -t "$RUNNER_TEMP/hr-replacement-source.zip"
          sha256sum "$RUNNER_TEMP/hr-replacement-source.zip" | tee "$RUNNER_TEMP/hr-replacement-source.zip.sha256"
      - name: Upload temporary source snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: STOCKLAND-HR-REPLACEMENT-SOURCE-SNAPSHOT
          path: |
            ${{ runner.temp }}/hr-replacement-source.zip
            ${{ runner.temp }}/hr-replacement-source.zip.sha256
          if-no-files-found: error
          retention-days: 1
