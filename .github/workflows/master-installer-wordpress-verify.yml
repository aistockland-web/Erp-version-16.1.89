name: Stockland 16.2.18 master installer WordPress verification

on:
  push:
    branches: ['delivery/**']
    paths:
      - 'src/stockland-erp-app/**'
      - 'scripts/release/**'
      - 'STOCKLAND_ERP_16.2.18_MASTER_WORDPRESS_INSTALLER.zip*'
      - '.github/workflows/master-installer-wordpress-verify.yml'
  pull_request:
    branches: ['delivery/stockland-full-erp-completion-2026-11-11']
    paths:
      - 'src/stockland-erp-app/**'
      - 'scripts/release/**'
      - 'STOCKLAND_ERP_16.2.18_MASTER_WORDPRESS_INSTALLER.zip*'
      - '.github/workflows/master-installer-wordpress-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: master-installer-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: WordPress + ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        db: [mariadb, mysql8]
    services:
      mariadb:
        image: ${{ matrix.db == 'mariadb' && 'mariadb:10.11' || 'mysql:8.0' }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: wp
          MARIADB_DATABASE: wp
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.3"
          extensions: mysqli, mbstring, xml, zip, curl, gd
          ini-values: upload_max_filesize=16M, post_max_size=20M, memory_limit=512M

      - name: Report database server and PHP limits
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e "SELECT VERSION() AS db_version, @@sql_mode AS sql_mode" wp
          php -r 'echo "PHP ", PHP_VERSION, " upload=", ini_get("upload_max_filesize"), " post=", ini_get("post_max_size"), PHP_EOL;'

      - name: Static syntax and disposable-database safety checks
        run: |
          set -euo pipefail
          find src/stockland-erp-app -name '*.php' -print0 | xargs -0 -n1 php -l
          find scripts/release -name '*.php' -print0 | xargs -0 -n1 php -l
          bash -n scripts/release/verify_master_installer.sh scripts/release/backup_restore_check.sh scripts/release/e2e/run_all.sh scripts/release/tests/backup_restore_guard_test.sh
          bash scripts/release/tests/backup_restore_guard_test.sh
          python3 -m py_compile scripts/release/build_master_installer.py
          node --check scripts/release/ui/ui_smoke.js
          node --check scripts/release/ui/admin_launcher_smoke.js

      - name: Build installer from the exact source tree under test
        run: |
          set -euo pipefail
          python3 scripts/release/build_master_installer.py --update-manifest --out-dir "$PWD"
          sha256sum -c STOCKLAND_ERP_16.2.18_MASTER_WORDPRESS_INSTALLER.zip.sha256
          python3 - <<'PY'
          import hashlib, os, zipfile
          z = zipfile.ZipFile("STOCKLAND_ERP_16.2.18_MASTER_WORDPRESS_INSTALLER.zip")
          root = "src/stockland-erp-app"
          tree = {}
          for d, _, fs in os.walk(root):
              for f in fs:
                  p = os.path.join(d, f)
                  tree["stockland-erp-app/" + os.path.relpath(p, root).replace(os.sep, "/")] = hashlib.sha256(open(p, "rb").read()).hexdigest()
          zipped = {n: hashlib.sha256(z.read(n)).hexdigest() for n in z.namelist() if not n.endswith("/")}
          missing = sorted(set(tree) - set(zipped)); extra = sorted(set(zipped) - set(tree))
          changed = sorted(n for n in tree if n in zipped and tree[n] != zipped[n])
          assert not (missing or extra or changed), (missing, extra, changed)
          print("PASS ZIP holds exactly the", len(tree), "source files with identical SHA-256")
          PY

      - name: Install WP-CLI and WordPress
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/wp https://github.com/wp-cli/wp-cli/releases/download/v2.12.0/wp-cli-2.12.0.phar
          chmod +x /usr/local/bin/wp
          mkdir -p /tmp/wp
          wp --allow-root core download --path=/tmp/wp --force
          wp --allow-root config create --path=/tmp/wp --dbname=wp --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check

      - name: Install the master installer and verify (disposable site)
        env:
          STOCKLAND_DISPOSABLE_SITE: "yes"
          STOCKLAND_DISPOSABLE_DB_NAME: "wp"
          STOCKLAND_DISPOSABLE_DB_HOST: "127.0.0.1"
        run: bash scripts/release/verify_master_installer.sh /tmp/wp "$PWD/STOCKLAND_ERP_16.2.18_MASTER_WORDPRESS_INSTALLER.zip"

      - name: Business workflow regression (procurement to ledger)
        env:
          STOCKLAND_DISPOSABLE_SITE: "yes"
        run: |
          set -o pipefail
          bash scripts/release/e2e/run_all.sh /tmp/wp | tee /tmp/e2e.log
          grep -q "GL unbalanced journals: 0" /tmp/e2e.log
          grep -q "RESULT PASS" /tmp/e2e.log

      - name: Backup and restore drill (dump, restore to a scratch database, checksum every table)
        env:
          STOCKLAND_DISPOSABLE_SITE: "yes"
          STOCKLAND_DISPOSABLE_DB_NAME: "wp"
          STOCKLAND_DISPOSABLE_DB_HOST: "127.0.0.1"
          MYSQL_ADMIN_ARGS: "-h127.0.0.1 -uroot -proot"
        run: bash scripts/release/backup_restore_check.sh /tmp/wp /tmp/backup-drill | tee /tmp/backup-drill.log

      - name: Set up Node.js for browser acceptance
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install isolated Playwright browser tooling
        run: |
          set -euo pipefail
          npm install --prefix /tmp/stockland-playwright --no-save --no-audit --no-fund playwright@1.57.0
          /tmp/stockland-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Standalone ERP browser smoke — disposable site only
        env:
          STOCKLAND_DISPOSABLE_SITE: "yes"
        run: |
          set -euo pipefail
          QA_PASSWORD="$(openssl rand -hex 18)"
          wp --path=/tmp/wp --allow-root user update admin --user_pass="$QA_PASSWORD"
          wp --path=/tmp/wp --allow-root option update home http://127.0.0.1:8080
          wp --path=/tmp/wp --allow-root option update siteurl http://127.0.0.1:8080
          wp --path=/tmp/wp --allow-root option update permalink_structure '/%postname%/'
          wp --path=/tmp/wp --allow-root rewrite flush

          cat > /tmp/wp/router.php <<'PHP'
          <?php
          $path = parse_url( $_SERVER['REQUEST_URI'] ?? '/', PHP_URL_PATH );
          $file = __DIR__ . $path;
          if ( '/' !== $path && is_file( $file ) ) {
              return false;
          }
          require __DIR__ . '/index.php';
          PHP

          mkdir -p /tmp/stockland-ui-smoke
          php -S 127.0.0.1:8080 -t /tmp/wp /tmp/wp/router.php > /tmp/stockland-php-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/wp-login.php >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8080/wp-login.php >/dev/null
          set +e
          NODE_PATH=/tmp/stockland-playwright/node_modules node scripts/release/ui/ui_smoke.js \
            http://127.0.0.1:8080 admin "$QA_PASSWORD" /tmp/stockland-ui-smoke 2>&1 | tee /tmp/ui-smoke.log
          UI_SMOKE_STATUS=${PIPESTATUS[0]}
          NODE_PATH=/tmp/stockland-playwright/node_modules node scripts/release/ui/admin_launcher_smoke.js \
            http://127.0.0.1:8080 admin "$QA_PASSWORD" 2>&1 | tee /tmp/admin-launcher-smoke.log
          ADMIN_LAUNCHER_STATUS=${PIPESTATUS[0]}
          unset QA_PASSWORD
          set -e
          if [[ "$UI_SMOKE_STATUS" -ne 0 || "$ADMIN_LAUNCHER_STATUS" -ne 0 ]]; then
            echo "Browser acceptance failed: ui_smoke=$UI_SMOKE_STATUS admin_launcher=$ADMIN_LAUNCHER_STATUS"
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: master-installer-${{ matrix.db }}
          path: |
            /tmp/e2e.log
            /tmp/backup-drill.log
            /tmp/ui-smoke.log
            /tmp/admin-launcher-smoke.log
            /tmp/stockland-ui-smoke/*.png
            /tmp/stockland-php-server.log
            STOCKLAND_ERP_16.2.18_MASTER_WORDPRESS_INSTALLER.zip.sha256
          if-no-files-found: warn


  publish-reviewed-one-pack-artifact:
    name: Publish downloadable one-pack installer artifact
    needs: verify
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Rebuild the installer from the exact verified source
        run: |
          set -euo pipefail
          python3 scripts/release/build_master_installer.py --update-manifest --out-dir "$PWD"

      - name: Re-verify the exact installer checksum
        run: |
          set -euo pipefail
          sha256sum -c STOCKLAND_ERP_16.2.18_MASTER_WORDPRESS_INSTALLER.zip.sha256
          test -s STOCKLAND_ERP_16.2.18_MASTER_WORDPRESS_INSTALLER.zip

      - name: Upload the one-pack installer and release evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stockland-erp-16.2.18-one-pack-installer
          path: |
            STOCKLAND_ERP_16.2.18_MASTER_WORDPRESS_INSTALLER.zip
            STOCKLAND_ERP_16.2.18_MASTER_WORDPRESS_INSTALLER.zip.sha256
            docs/engineering/STOCKLAND_ERP_16.2.18_MASTER_INSTALLER_EVIDENCE_2026-11-11.md
          if-no-files-found: error
          retention-days: 30
