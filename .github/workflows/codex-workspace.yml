name: Stockland Codex workspace configuration

on:
  push:
    branches: ["codex/**"]
    paths:
      - ".codex/**"
      - ".agents/**"
      - "scripts/codespaces/bootstrap_codex.sh"
      - "scripts/codespaces/test_codex_config.py"
      - "scripts/codespaces/bootstrap_project_source.py"
      - "scripts/codespaces/bootstrap_project_source.sh"
      - "scripts/codespaces/test_project_source.py"
      - "scripts/codespaces/verify_candidate_archives.py"
      - "STOCKLAND_ERP_16.2.13_WORDPRESS_INSTALLER*.zip"
      - "STOCKLAND_ERP_16.2.13_WORDPRESS_INSTALLER*.sha256"
      - "src/README.md"
      - ".devcontainer/post-create.sh"
      - ".github/workflows/codex-workspace.yml"
      - "docs/engineering/CODEX_CODESPACES_SETUP_2026-11-11.md"
  pull_request:
    branches: [main, "integration/**"]
    paths:
      - ".codex/**"
      - ".agents/**"
      - "scripts/codespaces/bootstrap_codex.sh"
      - "scripts/codespaces/test_codex_config.py"
      - "scripts/codespaces/bootstrap_project_source.py"
      - "scripts/codespaces/bootstrap_project_source.sh"
      - "scripts/codespaces/test_project_source.py"
      - "scripts/codespaces/verify_candidate_archives.py"
      - "STOCKLAND_ERP_16.2.13_WORDPRESS_INSTALLER*.zip"
      - "STOCKLAND_ERP_16.2.13_WORDPRESS_INSTALLER*.sha256"
      - "src/README.md"
      - ".devcontainer/post-create.sh"
      - ".github/workflows/codex-workspace.yml"
      - "docs/engineering/CODEX_CODESPACES_SETUP_2026-11-11.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockland-codex-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  codex-project-config:
    name: Validate Codex project instructions, agents, skills, and plugins
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate project-scoped Codex TOML, agent roles, skill, and pinned marketplace
        run: python scripts/codespaces/test_codex_config.py
      - name: Validate exact-source importer and rebuild protections
        run: |
          set -euo pipefail
          bash -n scripts/codespaces/bootstrap_project_source.sh
          python -m py_compile scripts/codespaces/bootstrap_project_source.py scripts/codespaces/test_project_source.py
          python scripts/codespaces/test_project_source.py
          # Exercise the same verifier and source import against the real committed installers.
          stage="$RUNNER_TEMP/stockland-candidate-packages"
          report="$RUNNER_TEMP/stockland-package-intake.json"
          dest="$RUNNER_TEMP/stockland-editable/src/stockland-erp-app"
          marker="$RUNNER_TEMP/stockland-editable/src/.stockland-erp-app.source.json"
          python scripts/codespaces/verify_candidate_archives.py --report "$report" --extract-root "$stage"
          python scripts/codespaces/bootstrap_project_source.py --stage-root "$stage" --intake-report "$report" --destination "$dest" --marker "$marker"
          python - "$report" "$dest" <<'PY'
          import hashlib, json, pathlib, sys
          manifest=json.load(open(sys.argv[1], encoding="utf-8"))["16.2.13"]["files"]
          root=pathlib.Path(sys.argv[2])
          actual={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob("*") if p.is_file()}
          assert actual == manifest, "editable source does not match the committed .13 file manifest"
          print(f"PASS: real .13 source import; {len(actual)} files match the exact package manifest")
          PY
          printf '%s\n' 'rebuild-preservation-check' > "$dest/.codespaces-preserve-check"
          python scripts/codespaces/bootstrap_project_source.py --stage-root "$stage" --intake-report "$report" --destination "$dest" --marker "$marker"
          grep -qx 'rebuild-preservation-check' "$dest/.codespaces-preserve-check"
      - name: Validate bootstrap and Codespaces post-create shell syntax
        run: |
          set -euo pipefail
          bash -n scripts/codespaces/bootstrap_codex.sh
          bash -n .devcontainer/post-create.sh
          python -m py_compile scripts/codespaces/test_codex_config.py
      - name: Check whitespace and accidental conflict markers
        run: |
          set -euo pipefail
          git diff --check
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' .codex .agents scripts/codespaces/test_codex_config.py scripts/codespaces/bootstrap_codex.sh; then
            echo "Conflict marker found in Codex workspace resources." >&2
            exit 1
          fi
