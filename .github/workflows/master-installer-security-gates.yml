name: Stockland 16.2.18 security and runtime gates

on:
  pull_request:
    paths: ['src/stockland-erp-app/**', 'scripts/release/security/**', '.github/workflows/master-installer-security-gates.yml']
  push:
    branches: ['delivery/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gates:
    name: Gates on PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Fetch analysis tools
        run: |
          mkdir -p /tmp/tools && cd /tmp/tools
          for r in semgrep/semgrep-rules PHPCSStandards/PHP_CodeSniffer WordPress/WordPress-Coding-Standards PHPCSStandards/PHPCSUtils PHPCSStandards/PHPCSExtra PHPCompatibility/PHPCompatibility PHPCompatibility/PHPCompatibilityWP PHPCompatibility/PHPCompatibilityParagonie; do
            git clone -q --depth 1 "https://github.com/$r.git"
          done
          pip install -q semgrep
      - name: Run gates over the exact plugin source
        run: python3 scripts/release/security/run_gates.py src/stockland-erp-app /tmp/tools | tee /tmp/gates.txt
      - name: Prove the gate fails on a planted secret
        run: |
          rm -rf /tmp/neg && mkdir /tmp/neg && cp -r src/stockland-erp-app /tmp/neg/p
          printf '<?php\n$k="ghp_%s";\n' "$(head -c 40 /dev/zero | tr '\0' 'a')" > /tmp/neg/p/includes/planted.php
          if python3 scripts/release/security/run_gates.py /tmp/neg/p /tmp/tools >/tmp/neg.txt 2>&1; then echo "gate accepted a planted secret"; exit 1; fi
          grep -q "SECRET pattern" /tmp/neg.txt
      - uses: actions/upload-artifact@v4
        with:
          name: security-gates-php${{ matrix.php }}
          path: /tmp/gates.txt
