name: Reports Explorer 16.1.93 exact-package gates

on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/patch_reports_explorer.py'
      - 'ci/patch_stock_reconciliation.py'
      - 'ci/patch_production_hardening.py'
      - 'ci/management_intelligence_fragment.js'
      - 'ci/qa/test_reports_explorer.py'
      - 'ci/qa/test_desktop_product_create.py'
      - 'STOCKLAND_ERP_16.1.93_DESKTOP_PRODUCT_CREATE_AUDIT.md'
      - '.github/workflows/reports-explorer-16-1-93.yml'
      - 'STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip'
      - 'STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip.sha256'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wordpress-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated pull request
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify audited input archive
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip.sha256
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip')
          expected = 'adec43b84f2b9a62d8913f84bad20588166800b2b6571d22d75abb86fcfd3fcd'
          assert p.stat().st_size == 1113446, 'baseline size mismatch'
          assert hashlib.sha256(p.read_bytes()).hexdigest() == expected, 'baseline checksum mismatch'
          print('PASS exact audited 16.1.92 baseline')
          PY
      - name: Run Reports Explorer regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/qa/test_reports_explorer.py | tee STOCKLAND_ERP_16.1.93_LOCAL_QA_RESULTS.txt
      - name: Build the consolidated WordPress update package
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/patch_reports_explorer.py | tee STOCKLAND_ERP_16.1.93_BUILD_RECEIPT.json
          sha256sum STOCKLAND_ERP_16.1.93_WORDPRESS_UPDATE.zip > STOCKLAND_ERP_16.1.93_WORDPRESS_UPDATE.zip.sha256
          mkdir -p build/wordpress-update
          unzip -q STOCKLAND_ERP_16.1.93_WORDPRESS_UPDATE.zip -d build/wordpress-update
      - name: Install pinned Playwright browser test dependency
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.57.0'
          python3 -m playwright install --with-deps chromium
      - name: Test desktop Product Master click-to-create chain across wide viewports
        run: |
          python3 ci/qa/test_desktop_product_create.py STOCKLAND_ERP_16.1.93_WORDPRESS_UPDATE.zip | tee STOCKLAND_ERP_16.1.93_DESKTOP_BUTTON_QA.json
      - name: Verify installable WordPress update archive
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check STOCKLAND_ERP_16.1.93_WORDPRESS_UPDATE.zip.sha256
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path('STOCKLAND_ERP_16.1.93_WORDPRESS_UPDATE.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, 'WordPress ZIP CRC failure'
              names = [i.filename for i in z.infolist() if not i.is_dir()]
              assert len(names) == 75 and len(names) == len(set(names)), 'WordPress package inventory changed'
              assert all(n.startswith('stockland-erp-app/') and '..' not in n.split('/') for n in names), 'Unsafe ZIP path'
              assert 'stockland-erp-app/includes/rest/class-rest-inventory-report-v16.php' in names
          print('PASS installable WordPress update archive, 75 plugin files')
          PY
      - name: Lint every packaged PHP file
        shell: bash
        run: |
          set -euo pipefail
          find build/wordpress-update/stockland-erp-app -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee STOCKLAND_ERP_16.1.93_PHP_LINT.txt
      - name: Check JavaScript syntax
        run: |
          node --check build/wordpress-update/stockland-erp-app/assets/app.js
          node --check build/wordpress-update/stockland-erp-app/assets/pwa.js
      - name: Check release JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/wordpress-update/stockland-erp-app')
          for name in ('RELEASE_MANIFEST.json','assets/manifest.json','assets/css/modules.json'):
              json.loads((root/name).read_text(encoding='utf-8'))
          manifest=json.loads((root/'RELEASE_MANIFEST.json').read_text())
          assert manifest['release']=='16.1.93'
          print('PASS JSON syntax and release identity')
          PY
      - name: Publish the installable WordPress update and QA receipts
        uses: actions/upload-artifact@v4
        with:
          name: STOCKLAND-ERP-16.1.93-WordPress-Update
          path: |
            STOCKLAND_ERP_16.1.93_WORDPRESS_UPDATE.zip
            STOCKLAND_ERP_16.1.93_WORDPRESS_UPDATE.zip.sha256
            STOCKLAND_ERP_16.1.93_LOCAL_QA_RESULTS.txt
            STOCKLAND_ERP_16.1.93_BUILD_RECEIPT.json
            STOCKLAND_ERP_16.1.93_PHP_LINT.txt
            STOCKLAND_ERP_16.1.93_DESKTOP_BUTTON_QA.json
            STOCKLAND_ERP_16.1.93_DESKTOP_PRODUCT_CREATE_AUDIT.md
          if-no-files-found: error
          retention-days: 14
