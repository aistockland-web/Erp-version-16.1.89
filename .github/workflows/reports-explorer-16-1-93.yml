name: Cumulative Stockland ERP 16.1.96 HR & Payroll candidate gates

on:
  # Run the cumulative release gate on the exact branch head after every release-source
  # or verifier change. Pull-request-only receipts are insufficient for artifact release.
  push:
    branches: [feat/reports-explorer-16-1-93, feature/full-hr-payroll-lifecycle-16-1-96]
    paths:
      - 'ci/**'
      - '.github/workflows/reports-explorer-16-1-93.yml'
      - 'STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip'
      - 'STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip.sha256'
  pull_request:
    branches: [main]
    paths:
      - 'ci/**'
      - '.github/workflows/reports-explorer-16-1-93.yml'
      - 'STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip'
      - 'STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip.sha256'
  workflow_dispatch:
    inputs:
      run_hr_candidate:
        description: 'Run the HR candidate build only for explicit review after schema design is approved'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wordpress-update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify audited input archive
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip.sha256
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip')
          expected = 'adec43b84f2b9a62d8913f84bad20588166800b2b6571d22d75abb86fcfd3fcd'
          assert p.stat().st_size == 1113446, 'baseline size mismatch'
          assert hashlib.sha256(p.read_bytes()).hexdigest() == expected, 'baseline checksum mismatch'
          print('PASS exact audited 16.1.92 baseline')
          PY
      - name: Detect whether this change is an HR candidate change
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          DISPATCH_RUN_HR: ${{ inputs.run_hr_candidate }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$DISPATCH_RUN_HR" = "true" ]; then
              echo "run_hr_candidate=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_hr_candidate=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "origin/$BASE_REF...HEAD" > "$RUNNER_TEMP/changed-files.txt"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "${{ github.event.before }}" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          else
            git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files.txt"
          fi
          cat "$RUNNER_TEMP/changed-files.txt"
          if grep -Eq '^(ci/patch_full_hr_payroll_16_1_96\.py|ci/hr_payroll_overlay/|ci/qa/test_full_hr_payroll_16_1_96\.py|STOCKLAND_ERP_16\.1\.96_)' "$RUNNER_TEMP/changed-files.txt"; then
            echo "run_hr_candidate=true" >> "$GITHUB_OUTPUT"
            echo "HR-specific source changed; candidate gates will run and the additive-only schema gate will block legacy table changes."
          else
            echo "run_hr_candidate=false" >> "$GITHUB_OUTPUT"
            echo "No HR candidate source changed; baseline/reporting release gates only. HR release evidence is not asserted by this run."
          fi
      - name: Compile all CI Python scripts and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q ci
      - name: Test HR lifecycle batch-boundary matcher
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/qa/test_hr_batch_boundary.py
      - name: Run Reports Explorer regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/qa/test_reports_explorer.py | tee STOCKLAND_ERP_16.1.94_LOCAL_QA_RESULTS.txt
      - name: Build cumulative 16.1.93 patch chain from locked canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/patch_reports_explorer.py | tee STOCKLAND_ERP_16.1.93_BUILD_RECEIPT.json
          sha256sum STOCKLAND_ERP_16.1.93_WORDPRESS_UPDATE.zip > STOCKLAND_ERP_16.1.93_WORDPRESS_UPDATE.zip.sha256
      - name: Finalize cumulative WordPress update 16.1.94 and verify against baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/finalize_release_16_1_94.py STOCKLAND_ERP_16.1.93_WORDPRESS_UPDATE.zip --output STOCKLAND_ERP_16.1.94_CANONICAL_WORDPRESS_UPDATE.zip
          sha256sum --check STOCKLAND_ERP_16.1.94_CANONICAL_WORDPRESS_UPDATE.zip.sha256
          python3 ci/qa/verify_final_package.py \
            --baseline STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip \
            --package STOCKLAND_ERP_16.1.94_CANONICAL_WORDPRESS_UPDATE.zip \
            --sha256 STOCKLAND_ERP_16.1.94_CANONICAL_WORDPRESS_UPDATE.zip.sha256 \
            --build-receipt STOCKLAND_ERP_16.1.93_BUILD_RECEIPT.json \
            --release-receipt STOCKLAND_ERP_16.1.94_CANONICAL_WORDPRESS_UPDATE.receipt.json \
            --output STOCKLAND_ERP_16.1.94_FINAL_PACKAGE_RECEIPT.json | tee STOCKLAND_ERP_16.1.94_FINAL_PACKAGE_GATE.txt
          mkdir -p build/wordpress-update
          unzip -q STOCKLAND_ERP_16.1.94_CANONICAL_WORDPRESS_UPDATE.zip -d build/wordpress-update
      - name: Build and verify cumulative 16.1.95 operational-hardening package
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/patch_operational_hardening_16_1_95.py \
            --input STOCKLAND_ERP_16.1.94_CANONICAL_WORDPRESS_UPDATE.zip \
            --output STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip \
            --receipt STOCKLAND_ERP_16.1.95_RELEASE_RECEIPT.json | tee STOCKLAND_ERP_16.1.95_BUILD_RECEIPT.json
          sha256sum --check STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip.sha256
          rm -rf build/wordpress-update
          mkdir -p build/wordpress-update
          unzip -q STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip -d build/wordpress-update
          python3 ci/qa/test_release_16_1_95.py \
            --baseline STOCKLAND_ERP_16.1.94_CANONICAL_WORDPRESS_UPDATE.zip \
            --package STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip \
            --receipt STOCKLAND_ERP_16.1.95_RELEASE_RECEIPT.json | tee STOCKLAND_ERP_16.1.95_LOCAL_QA_RESULTS.txt
          node ci/qa/test_plain_permalink_url.js STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip | tee STOCKLAND_ERP_16.1.95_PLAIN_PERMALINK_QA.txt
      - name: Install pinned Playwright browser test dependency
        run: |
          python3 -m pip install --disable-pip-version-check 'playwright==1.57.0'
          python3 -m playwright install --with-deps chromium
      - name: Test desktop Product Master click-to-create chain across wide viewports
        run: |
          python3 ci/qa/test_desktop_product_create.py STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip --receipt STOCKLAND_ERP_16.1.95_DESKTOP_BUTTON_QA.json
          test -s STOCKLAND_ERP_16.1.95_DESKTOP_BUTTON_QA.json
      - name: Test Reports loading failure, retry, and success recovery
        run: |
          python3 ci/qa/test_reports_loading.py STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip | tee STOCKLAND_ERP_16.1.95_REPORT_LOADING_QA.json
      - name: Test requisition approval history and supply tables at mobile/desktop widths
        run: |
          python3 ci/qa/test_requisition_responsive.py STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip | tee STOCKLAND_ERP_16.1.95_REQUISITION_RESPONSIVE_QA.json
      - name: Smoke-test all ERP work areas and role navigation at phone/desktop widths
        run: |
          python3 ci/qa/test_all_workareas_responsive.py STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip | tee STOCKLAND_ERP_16.1.95_ALL_WORKAREAS_QA.json
      - name: Verify compiled CSS, source-module parity, and PostCSS parse
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix ci/cssqa --ignore-scripts
          NODE_PATH="${GITHUB_WORKSPACE}/ci/cssqa/node_modules" node ci/qa/check-css-postcss.js build/wordpress-update/stockland-erp-app
      - name: Verify installable WordPress update archive
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip.sha256
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          p = Path('STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, 'WordPress ZIP CRC failure'
              names = [i.filename for i in z.infolist() if not i.is_dir()]
              assert len(names) == 75 and len(names) == len(set(names)), 'WordPress package inventory changed'
              assert all(n.startswith('stockland-erp-app/') and '..' not in n.split('/') for n in names), 'Unsafe ZIP path'
              assert 'stockland-erp-app/includes/rest/class-rest-inventory-report-v16.php' in names
              assert z.read('stockland-erp-app/RELEASE_MANIFEST.json')
              import json
              manifest=json.loads(z.read('stockland-erp-app/RELEASE_MANIFEST.json').decode('utf-8'))
              modules=json.loads(z.read('stockland-erp-app/assets/css/modules.json').decode('utf-8'))
              entry=z.read('stockland-erp-app/stockland-inventory.php').decode('utf-8')
              front=z.read('stockland-erp-app/includes/class-stockland-frontend.php').decode('utf-8')
              assert manifest['release']=='16.1.95' and modules['release']=='16.1.95'
              assert "Version:           16.1.95" in entry and "define( 'STOCKLAND_VERSION', '16.1.95' );" in entry
              assert "const ROUTE_VERSION      = '16.1.95';" in front
              assert manifest['schema_contract']['total']==49
              import hashlib, re
              assert manifest.get('frontend',{}).get('bootstrap_version') == '5.3.8', 'Bootstrap version absent or incorrect in release manifest'
              bootstrap=z.read('stockland-erp-app/assets/bootstrap.min.css')
              assert re.search(rb'Bootstrap\s+v5\.3\.8', bootstrap[:8192]), 'Bootstrap CSS header version mismatch'
              assert b'Licensed under MIT' in bootstrap[:8192], 'Bootstrap MIT license notice missing'
              assert manifest['frontend'].get('bootstrap_asset_sha256') == hashlib.sha256(bootstrap).hexdigest(), 'Bootstrap asset hash does not match manifest'
          print('PASS cumulative 16.1.95 WordPress update archive, 75 plugin files and version/schema markers')
          PY
      - name: Lint every packaged PHP file
        shell: bash
        run: |
          set -euo pipefail
          find build/wordpress-update/stockland-erp-app -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee STOCKLAND_ERP_16.1.95_PHP_LINT.txt
      - name: Check JavaScript syntax
        run: |
          node --check build/wordpress-update/stockland-erp-app/assets/app.js
          node --check build/wordpress-update/stockland-erp-app/assets/pwa.js
      - name: Check release JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('build/wordpress-update/stockland-erp-app')
          for name in ('RELEASE_MANIFEST.json','assets/manifest.json','assets/css/modules.json'):
              json.loads((root/name).read_text(encoding='utf-8'))
          manifest=json.loads((root/'RELEASE_MANIFEST.json').read_text())
          assert manifest['release']=='16.1.95'
          print('PASS JSON syntax and release identity')
          PY
      - name: Install locked WordPress Coding Standards tooling (CI only)
        run: composer install --working-dir=ci/phpcs --no-interaction --prefer-dist --no-progress
      - name: Run PHPCS/WPCS and reviewed security/database invariants on the final ZIP
        shell: bash
        run: |
          set -euo pipefail
          APP="build/wordpress-update/stockland-erp-app"
          set +e
          ci/phpcs/vendor/bin/phpcs --standard=WordPress --extensions=php --report=json --report-file=STOCKLAND_ERP_16.1.95_PHPCS_WPCS.json "$APP"
          PHPCS_EXIT=$?
          set -e
          test -s STOCKLAND_ERP_16.1.95_PHPCS_WPCS.json
          echo "Raw PHPCS exit code: $PHPCS_EXIT" > STOCKLAND_ERP_16.1.95_PHPCS_SUMMARY.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('STOCKLAND_ERP_16.1.95_PHPCS_WPCS.json').read_text(encoding='utf-8'))
          totals=data.get('totals', {})
          with Path('STOCKLAND_ERP_16.1.95_PHPCS_SUMMARY.txt').open('a', encoding='utf-8') as f:
              f.write(f"errors={totals.get('errors',0)}; warnings={totals.get('warnings',0)}; fixable={totals.get('fixable',0)}\n")
          PY
          python ci/qa/test-phpcs-security-review.py "$APP" STOCKLAND_ERP_16.1.95_PHPCS_WPCS.json | tee STOCKLAND_ERP_16.1.95_PHPCS_SECURITY_REVIEW.txt
      - name: Run Semgrep PHP/security-audit scan on the exact ZIP source (ignore-safe)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'semgrep==1.182.1'
          semgrep --version
          # Scan the exact install ZIP after extraction outside the repository's ignored build/ path.
          SCAN_ROOT="${RUNNER_TEMP}/stockland-erp-semgrep-source"
          rm -rf "$SCAN_ROOT"
          mkdir -p "$SCAN_ROOT"
          unzip -q STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip -d "$SCAN_ROOT"
          APP_SCAN="$SCAN_ROOT/stockland-erp-app"
          test -d "$APP_SCAN"
          PHP_COUNT="$(find "$APP_SCAN" -type f -name '*.php' | wc -l | tr -d ' ')"
          test "$PHP_COUNT" -gt 0
          echo "Packaged PHP source files to scan: $PHP_COUNT"
          semgrep scan --metrics=off --no-git-ignore --config p/php --config p/security-audit --include '*.php' --json --output STOCKLAND_ERP_16.1.95_SEMGREP.json "$APP_SCAN"
          python ci/qa/summarize-semgrep.py STOCKLAND_ERP_16.1.95_SEMGREP.json --expected-targets "$PHP_COUNT" | tee STOCKLAND_ERP_16.1.95_SEMGREP_SUMMARY.txt
      - name: Verify runtime dependency and license inventory for the final ZIP
        shell: bash
        run: |
          set -euo pipefail
          python ci/qa/test-dependency-inventory.py | tee STOCKLAND_ERP_16.1.95_DEPENDENCY_POLICY_TEST.txt
          python ci/qa/dependency-inventory.py build/wordpress-update/stockland-erp-app STOCKLAND_ERP_16.1.95_DEPENDENCY_LICENSE_INVENTORY.json | tee STOCKLAND_ERP_16.1.95_DEPENDENCY_INVENTORY_SUMMARY.txt
      - name: Test HR lifecycle batch-boundary matcher
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/qa/test_hr_batch_boundary.py
      - name: Build full HR & Payroll lifecycle candidate 16.1.96
        if: steps.scope.outputs.run_hr_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/patch_full_hr_payroll_16_1_96.py \
            --input STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip \
            --output STOCKLAND_ERP_16.1.96_FULL_HR_PAYROLL_LIFECYCLE_CANDIDATE_WORDPRESS_UPDATE.zip \
            | tee STOCKLAND_ERP_16.1.96_BUILD_RECEIPT.json
          sha256sum --check STOCKLAND_ERP_16.1.96_FULL_HR_PAYROLL_LIFECYCLE_CANDIDATE_WORDPRESS_UPDATE.zip.sha256
          mkdir -p build/wordpress-update-16.1.96
          unzip -q STOCKLAND_ERP_16.1.96_FULL_HR_PAYROLL_LIFECYCLE_CANDIDATE_WORDPRESS_UPDATE.zip -d build/wordpress-update-16.1.96
          python3 ci/qa/test_full_hr_payroll_16_1_96.py STOCKLAND_ERP_16.1.96_FULL_HR_PAYROLL_LIFECYCLE_CANDIDATE_WORDPRESS_UPDATE.zip | tee STOCKLAND_ERP_16.1.96_HR_PAYROLL_PACKAGE_QA.txt
      - name: Lint all PHP and JavaScript in 16.1.96 candidate
        if: steps.scope.outputs.run_hr_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP="build/wordpress-update-16.1.96/stockland-erp-app"
          test -d "$APP"
          find "$APP" -type f -name '*.php' -print0 | xargs -0 -n1 php -l | tee STOCKLAND_ERP_16.1.96_PHP_LINT.txt
          node --check "$APP/assets/app.js"
          node --check "$APP/assets/pwa.js"
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path
          zpath=Path('STOCKLAND_ERP_16.1.96_FULL_HR_PAYROLL_LIFECYCLE_CANDIDATE_WORDPRESS_UPDATE.zip')
          with zipfile.ZipFile(zpath) as z:
              root='stockland-erp-app/'
              entry=z.read(root+'stockland-inventory.php').decode()
              front=z.read(root+'includes/class-stockland-frontend.php').decode()
              manifest=json.loads(z.read(root+'RELEASE_MANIFEST.json').decode())
              assert "Version:           16.1.96" in entry
              assert "define( 'STOCKLAND_VERSION', '16.1.96' );" in entry
              assert "const ROUTE_VERSION      = '16.1.96';" in front
              assert manifest['schema_contract']['total']==73
          print('PASS 16.1.96 release identity and 73-table contract')
          PY
      - name: Verify 16.1.96 CSS module parity and responsive UI with PostCSS
        if: steps.scope.outputs.run_hr_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          NODE_PATH="${GITHUB_WORKSPACE}/ci/cssqa/node_modules" node ci/qa/check-css-postcss.js build/wordpress-update-16.1.96/stockland-erp-app
          python3 ci/qa/test_all_workareas_responsive.py STOCKLAND_ERP_16.1.96_FULL_HR_PAYROLL_LIFECYCLE_CANDIDATE_WORDPRESS_UPDATE.zip | tee STOCKLAND_ERP_16.1.96_ALL_WORKAREAS_QA.json
      - name: Run WPCS and reviewed security/database checks on the 16.1.96 ZIP
        if: steps.scope.outputs.run_hr_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APP="build/wordpress-update-16.1.96/stockland-erp-app"
          set +e
          ci/phpcs/vendor/bin/phpcs --standard=WordPress --extensions=php --report=json --report-file=STOCKLAND_ERP_16.1.96_PHPCS_WPCS.json "$APP"
          PHPCS_EXIT=$?
          set -e
          test -s STOCKLAND_ERP_16.1.96_PHPCS_WPCS.json
          python3 ci/qa/test-phpcs-security-review.py "$APP" STOCKLAND_ERP_16.1.96_PHPCS_WPCS.json | tee STOCKLAND_ERP_16.1.96_PHPCS_SECURITY_REVIEW.txt
          echo "PHPCS diagnostic exit: $PHPCS_EXIT" > STOCKLAND_ERP_16.1.96_PHPCS_SUMMARY.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('STOCKLAND_ERP_16.1.96_PHPCS_WPCS.json').read_text())
          t=data.get('totals',{})
          with Path('STOCKLAND_ERP_16.1.96_PHPCS_SUMMARY.txt').open('a') as f:
              f.write(f"errors={t.get('errors',0)}; warnings={t.get('warnings',0)}; fixable={t.get('fixable',0)}\n")
          PY
      - name: Semgrep and dependency inventory for the 16.1.96 candidate
        if: steps.scope.outputs.run_hr_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          SCAN_ROOT="${RUNNER_TEMP}/stockland-erp-16.1.96-semgrep-source"
          rm -rf "$SCAN_ROOT" && mkdir -p "$SCAN_ROOT"
          unzip -q STOCKLAND_ERP_16.1.96_FULL_HR_PAYROLL_LIFECYCLE_CANDIDATE_WORDPRESS_UPDATE.zip -d "$SCAN_ROOT"
          APP_SCAN="$SCAN_ROOT/stockland-erp-app"
          PHP_COUNT="$(find "$APP_SCAN" -type f -name '*.php' | wc -l | tr -d ' ')"
          semgrep scan --metrics=off --no-git-ignore --config p/php --config p/security-audit --include '*.php' --json --output STOCKLAND_ERP_16.1.96_SEMGREP.json "$APP_SCAN"
          python3 ci/qa/summarize-semgrep.py STOCKLAND_ERP_16.1.96_SEMGREP.json --expected-targets "$PHP_COUNT" | tee STOCKLAND_ERP_16.1.96_SEMGREP_SUMMARY.txt
          python3 ci/qa/dependency-inventory.py build/wordpress-update-16.1.96/stockland-erp-app STOCKLAND_ERP_16.1.96_DEPENDENCY_LICENSE_INVENTORY.json | tee STOCKLAND_ERP_16.1.96_DEPENDENCY_INVENTORY_SUMMARY.txt
      - name: Enforce additive-only HR schema freeze before artifact publication
        if: steps.scope.outputs.run_hr_candidate == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 ci/qa/test_hr_schema_additive.py \\
            --baseline STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip \\
            --candidate STOCKLAND_ERP_16.1.96_FULL_HR_PAYROLL_LIFECYCLE_CANDIDATE_WORDPRESS_UPDATE.zip
      - name: Publish the verified 16.1.96 WordPress update and audit receipts
        if: steps.scope.outputs.run_hr_candidate == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: STOCKLAND-ERP-16.1.96-Full-HR-Payroll-Lifecycle-Candidate
          path: |
            STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip
            STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip.sha256
            STOCKLAND_ERP_16.1.95_BUILD_RECEIPT.json
            STOCKLAND_ERP_16.1.95_RELEASE_RECEIPT.json
            STOCKLAND_ERP_16.1.95_LOCAL_QA_RESULTS.txt
            STOCKLAND_ERP_16.1.95_PLAIN_PERMALINK_QA.txt
            STOCKLAND_ERP_16.1.93_BUILD_RECEIPT.json
            STOCKLAND_ERP_16.1.94_CANONICAL_WORDPRESS_UPDATE.receipt.json
            STOCKLAND_ERP_16.1.94_FINAL_PACKAGE_RECEIPT.json
            STOCKLAND_ERP_16.1.94_FINAL_PACKAGE_GATE.txt
            STOCKLAND_ERP_16.1.95_PHP_LINT.txt
            STOCKLAND_ERP_16.1.95_DESKTOP_BUTTON_QA.json
            STOCKLAND_ERP_16.1.95_REPORT_LOADING_QA.json
            STOCKLAND_ERP_16.1.95_REQUISITION_RESPONSIVE_QA.json
            STOCKLAND_ERP_16.1.95_ALL_WORKAREAS_QA.json
            STOCKLAND_ERP_16.1.95_PHPCS_WPCS.json
            STOCKLAND_ERP_16.1.95_PHPCS_SECURITY_REVIEW.txt
            STOCKLAND_ERP_16.1.95_PHPCS_SUMMARY.txt
            STOCKLAND_ERP_16.1.95_SEMGREP.json
            STOCKLAND_ERP_16.1.95_SEMGREP_SUMMARY.txt
            STOCKLAND_ERP_16.1.95_DEPENDENCY_POLICY_TEST.txt
