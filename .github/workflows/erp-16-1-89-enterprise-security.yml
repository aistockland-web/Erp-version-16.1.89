name: Stockland ERP 16.1.89 enterprise security gates

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read
  security-events: write

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # These are the supported languages actually represented in this
        # repository. PHP is NOT supported by CodeQL; PHP SAST is handled by Semgrep.
        language: ["javascript-typescript", "actions"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare Python for exact release package generation
        if: matrix.language == 'javascript-typescript' && hashFiles('ci/build_release_16_1_91.py') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build exact current canonical ERP package before CodeQL extraction
        if: matrix.language == 'javascript-typescript' && hashFiles('ci/build_release_16_1_91.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'openpyxl==3.1.5'
          python ci/build_release_16_1_91.py
      - name: Extract the exact release JavaScript for CodeQL
        if: matrix.language == 'javascript-typescript'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'STOCKLAND_ERP_16.1.*_CANONICAL_WORDPRESS_UPDATE.zip' -print | sort -V | tail -n 1)"
          test -n "$ZIP"
          mkdir -p .ci-generated
          unzip -q "$ZIP" -d .ci-generated
          test -f .ci-generated/stockland-erp-app/assets/app.js
          test -f .ci-generated/stockland-erp-app/assets/pwa.js
          # Include generated JS in the local CodeQL scan without committing it.
          git add -N .ci-generated/stockland-erp-app/assets/app.js \
            .ci-generated/stockland-erp-app/assets/pwa.js
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - name: Analyze supported source
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  secret-scan:
    name: Secret scanning (repository history and extracted installer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Prepare Python for exact release package generation
        if: hashFiles('ci/build_release_16_1_91.py') != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build exact current canonical ERP package before package secret scan
        if: hashFiles('ci/build_release_16_1_91.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'openpyxl==3.1.5'
          python ci/build_release_16_1_91.py
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0 — immutable SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract exact installer and scan text files in package
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'STOCKLAND_ERP_16.1.*_CANONICAL_WORDPRESS_UPDATE.zip' -print | sort -V | tail -n 1)"
          test -n "$ZIP"
          mkdir -p "$RUNNER_TEMP/stockland-release" "$RUNNER_TEMP/gitleaks-reports"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/stockland-release"
          docker run --rm \
            -v "$RUNNER_TEMP/stockland-release/stockland-erp-app:/scan:ro" \
            -v "$RUNNER_TEMP/gitleaks-reports:/report" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            dir /scan --redact --report-format sarif \
            --report-path /report/gitleaks-package.sarif
      - name: Upload package secret-scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-package-sarif
          path: ${{ runner.temp }}/gitleaks-reports/gitleaks-package.sarif
          if-no-files-found: warn

  dependency-review:
    name: Repository dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect dependency manifest or lockfile changes
        id: manifest_changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/stockland-changed-files.txt"
          if grep -E '(^|/)(composer\.json|composer\.lock|package\.json|package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|bun\.lockb?|requirements\.txt|pyproject\.toml|poetry\.lock|Pipfile(\.lock)?|go\.mod|go\.sum|Cargo\.toml|Cargo\.lock)$' "$RUNNER_TEMP/stockland-changed-files.txt"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Explain why Dependency Review is not applicable to artifact-only changes
        if: steps.manifest_changes.outputs.found != 'true'
        run: |
          {
            echo "## Repository dependency review"
            echo "NOT APPLICABLE to this PR: no supported package-manager dependency manifest or lockfile changed."
            echo "The exact WordPress ZIP is separately inspected by the packaged dependency inventory; syntax, checksum, SAST, CodeQL and secret checks remain active."
            echo "Any future change to a supported manifest or lockfile activates the high-severity dependency-review gate."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Review dependency changes on this PR
        if: steps.manifest_changes.outputs.found == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  package-dependency-inventory:
    name: Packaged runtime dependency and license inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build exact current canonical ERP package for runtime dependency inventory
        if: hashFiles('ci/build_release_16_1_91.py') != ''
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'openpyxl==3.1.5'
          python ci/build_release_16_1_91.py
      - name: Test dependency inventory policy against positive and negative fixtures
        run: python ci/qa/test-dependency-inventory.py
      - name: Extract exact release installer
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name 'STOCKLAND_ERP_16.1.*_CANONICAL_WORDPRESS_UPDATE.zip' -print | sort -V | tail -n 1)"
          test -n "$ZIP"
          mkdir -p "$RUNNER_TEMP/stockland-release"
          unzip -q "$ZIP" -d "$RUNNER_TEMP/stockland-release"
      - name: Inventory bundled components, manifests, lockfiles and license evidence
        shell: bash
        run: |
          python ci/qa/dependency-inventory.py \
            "$RUNNER_TEMP/stockland-release/stockland-erp-app" \
            "$GITHUB_WORKSPACE/dependency-inventory.json"
          cat dependency-inventory.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dependency and license inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-dependency-license-inventory
          path: dependency-inventory.json
          if-no-files-found: error
