name: Stockland HR/payroll domain core tests

on:
  push:
    branches: [main]
    paths:
      - 'ci/hr_payroll_candidate/**'
  pull_request:
    branches: [main]
    paths:
      - 'ci/hr_payroll_candidate/**'
      - '.github/workflows/hr-payroll-engine-core.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockland-hr-domain-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  calculator-contract:
    name: Calculator fail-closed contract / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Detect whether the calculator source is part of this commit
        id: calculator
        shell: bash
        run: |
          if test -s ci/hr_payroll_candidate/Stockland_HR_Payroll_Calculator.php && test -s ci/hr_payroll_candidate/test_calculator.php; then
            echo "source_present=true" >> "$GITHUB_OUTPUT"
          else
            echo "source_present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Report workflow-only registration gate
        if: steps.calculator.outputs.source_present != 'true'
        run: echo "Workflow registration only; calculator source tests have not run in this commit."

      - name: PHP syntax
        if: steps.calculator.outputs.source_present == 'true'
        run: php -l ci/hr_payroll_candidate/Stockland_HR_Payroll_Calculator.php && php -l ci/hr_payroll_candidate/test_calculator.php

      - name: Synthetic calculator and fail-closed rules
        if: steps.calculator.outputs.source_present == 'true'
        run: php ci/hr_payroll_candidate/test_calculator.php
