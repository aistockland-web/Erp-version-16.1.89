name: Stockland Codespaces environment validation

on:
  push:
    branches:
      - 'infra/**'
      - 'fix/**'
      - 'delivery/**'
    paths:
      - '.devcontainer/**'
      - '.gitignore'
      - 'scripts/codespaces/**'
      - 'ci/codespaces/**'
      - 'scripts/release/verify_master_installer.sh'
      - 'scripts/release/e2e/**'
      - '.github/workflows/codespaces-environment.yml'
  pull_request:
    branches: [main, 'infra/**', 'fix/**', 'delivery/**']
    paths:
      - '.devcontainer/**'
      - '.gitignore'
      - 'scripts/codespaces/**'
      - 'ci/codespaces/**'
      - 'scripts/release/verify_master_installer.sh'
      - 'scripts/release/e2e/**'
      - '.github/workflows/codespaces-environment.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stockland-codespaces-environment-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Stockland devcontainer and WordPress services
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate devcontainer JSON and shell scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m json.tool .devcontainer/devcontainer.json >/dev/null
          bash -n .devcontainer/initialize-host.sh
          bash -n .devcontainer/post-create.sh
          bash -n .devcontainer/verify-master-installer.sh
          bash -n scripts/codespaces/bootstrap_wordpress_sites.sh
          bash -n scripts/codespaces/bootstrap_mysql8_site.sh
          bash -n scripts/codespaces/smoke_test_sites.sh
          bash -n scripts/codespaces/wp_cli_wrapper.sh
          bash -n scripts/codespaces/run_mysql8_parity.sh
          bash -n scripts/codespaces/test_bootstrap_wrapper.sh
          python3 scripts/codespaces/test_project_source.py
          bash scripts/codespaces/test_bootstrap_wrapper.sh
          bash -n scripts/release/verify_master_installer.sh
          bash -n scripts/release/e2e/run_all.sh
          bash -n scripts/codespaces/verify_approved_16_2_18.sh
          python3 -m py_compile ci/codespaces/verify_approved_16_2_18_zip.py
          python3 -m unittest discover -s ci/codespaces -p 'test_*.py' -v
          python3 -m json.tool ci/codespaces/candidate-packages.json >/dev/null

      - name: Prepare pinned 16.2.18 baseline test suite
        shell: bash
        env:
          BASELINE_SOURCE_COMMIT: 387c193c7999840c731d37acd854ec920f134507
        run: |
          set -euo pipefail
          mkdir -p artifacts/codespaces
          git fetch --no-tags --depth=1 origin "$BASELINE_SOURCE_COMMIT"
          archive="artifacts/codespaces/stockland-16.2.18-baseline-release-tests.tar.gz"
          git archive --format=tar "$BASELINE_SOURCE_COMMIT" scripts/release | gzip -n -9 > "$archive"
          sha256sum "$archive" > "$archive.sha256"
          tar -tzf "$archive" > "$archive.contents"
          grep -qx 'scripts/release/e2e/run_all.sh' "$archive.contents"
          rm -f "$archive.contents"
          echo "PASS pinned 16.2.18 baseline test suite from $BASELINE_SOURCE_COMMIT"

      - name: Create isolated CI credentials and validate Compose
        run: |
          set -euo pipefail
          bash .devcontainer/initialize-host.sh
          docker compose --project-directory .devcontainer -f .devcontainer/docker-compose.yml --profile mysql8 config --quiet

      - name: Build the PHP 8.3 / Node 22 Codespaces toolchain
        run: |
          docker build --pull --tag stockland-erp-codespaces-qa --file .devcontainer/Dockerfile .devcontainer

      - name: Verify the Codespaces runtime image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm stockland-erp-codespaces-qa php -v
          docker run --rm stockland-erp-codespaces-qa node --version
          docker run --rm stockland-erp-codespaces-qa composer --version
          modules="$(docker run --rm stockland-erp-codespaces-qa php -m)"
          for extension in curl dom fileinfo json mbstring mysqli openssl pdo_mysql simplexml xml zip; do
            if ! grep -qi "^$extension$" <<< "$modules"; then
              echo "Missing PHP extension: $extension" >&2
              exit 1
            fi
          done
          echo "PASS PHP 8.3, required WordPress extensions, Node 22 and Composer"

      - name: Start isolated WordPress, MariaDB and MySQL 8 services
        shell: bash
        run: |
          set -euo pipefail
          docker compose --project-directory .devcontainer -f .devcontainer/docker-compose.yml --profile mysql8 up -d --build
          docker compose --project-directory .devcontainer -f .devcontainer/docker-compose.yml --profile mysql8 ps

      - name: Verify exact approved 16.2.18 installer — no rebuild
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          docker compose --project-directory .devcontainer -f .devcontainer/docker-compose.yml --profile mysql8 exec -T -e GH_TOKEN="$GH_TOKEN" workspace bash scripts/codespaces/verify_approved_16_2_18.sh all

      - name: Stop disposable databases and WordPress containers
        if: always()
        shell: bash
        run: |
          docker compose --project-directory .devcontainer -f .devcontainer/docker-compose.yml --profile mysql8 down --volumes --remove-orphans
