name: Stockland ERP 16.1.90 canonical release gates

on:
  push:
    branches:
      - release/16.1.90-rest-context-remediation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  security-events: write

jobs:
  build-and-verify:
    name: Build / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4"]
    steps:
      - name: Checkout exact PR or release branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Confirm Python / Node toolchain
        shell: bash
        run: |
          set -euo pipefail
          python --version
          node --version
          python - <<'PY'
          import sys
          assert sys.version_info[:2] == (3, 12), f"Expected Python 3.12, got {sys.version}"
          PY
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer
      - name: Install PHPCS and official WordPress Coding Standards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wpcs-project"
          cd "$RUNNER_TEMP/wpcs-project"
          composer init --name=stockland/erp-ci --no-interaction --stability=stable --type=project
          composer config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer require --dev --no-interaction wp-coding-standards/wpcs:"^3.0"
          echo "$RUNNER_TEMP/wpcs-project/vendor/bin" >> "$GITHUB_PATH"
      - name: Build from exact 16.1.89 base (release branch only)
        if: github.event_name != 'pull_request'
        run: python ci/build_release_16_1_90.py --phpcbf "$RUNNER_TEMP/wpcs-project/vendor/bin/phpcbf"
      - name: Verify checksum, archive structure and 16.1.90 source invariants
        run: python ci/qa/test-release-16.1.90.py
      - name: Extract exact 16.1.90 ZIP for regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stockland-v1690"
          unzip -q STOCKLAND_ERP_16.1.90_CANONICAL_WORDPRESS_UPDATE.zip -d "$RUNNER_TEMP/stockland-v1690"
          test -d "$RUNNER_TEMP/stockland-v1690/stockland-erp-app"
          echo "STOCKLAND_APP=$RUNNER_TEMP/stockland-v1690/stockland-erp-app" >> "$GITHUB_ENV"
      - name: PHP syntax lint — every runtime PHP file
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            php -l "$file"
            count=$((count + 1))
          done < <(find "$STOCKLAND_APP" -type f -name '*.php' -print0)
          test "$count" -eq 47
          echo "47/47 PHP files passed"
      - name: JavaScript syntax
        run: |
          node --check "$STOCKLAND_APP/assets/app.js"
          node --check "$STOCKLAND_APP/assets/pwa.js"
      - name: Payroll/System Health positive and negative regressions
        run: php ci/qa/test-payroll-health-policy.php "$STOCKLAND_APP"
      - name: Notification rendering and existing action hooks
        run: node ci/qa/test-notification-drawer.js "$STOCKLAND_APP/assets/app.js"
      - name: Browser-side payroll preview regression
        run: node ci/qa/test-payroll-preview.js "$STOCKLAND_APP/assets/app.js"
      - name: PostCSS and responsive CSS module regression
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/cssqa" --no-save postcss@8
          NODE_PATH="$RUNNER_TEMP/cssqa/node_modules" node ci/qa/check-css-postcss.js "$STOCKLAND_APP"
      - name: WordPress Coding Standards with registered Stockland capabilities
        shell: bash
        run: |
          set -euo pipefail
          phpcs --standard=ci/qa/stockland-phpcs.xml --extensions=php --report=json --report-file=phpcs-16.1.90.json "$STOCKLAND_APP"
          python - <<'PY'
          import json
          r=json.load(open("phpcs-16.1.90.json",encoding="utf-8"))
          t=r.get("totals",{})
          print(f"PHPCS/WPCS: {t.get('errors',0)} errors; {t.get('warnings',0)} warnings; {t.get('fixable',0)} fixable")
          assert t.get("errors",0)==0 and t.get("warnings",0)==0, "Unexpected PHPCS/WPCS finding in the reviewed ruleset"
          PY
      - name: Semgrep PHP/security audit
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'semgrep==1.139.0'
          semgrep scan --metrics=off --config p/php --config p/security-audit --include '*.php' --json --output semgrep-16.1.90.json "$STOCKLAND_APP"
          python ci/qa/summarize-semgrep.py semgrep-16.1.90.json
      - name: Upload exact version PHPCS / Semgrep reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: stockland-16.1.90-source-security-reports-php-${{ matrix.php-version }}
          path: |
            phpcs-16.1.90.json
            semgrep-16.1.90.json
          if-no-files-found: warn
      - name: Commit the canonical package on the release branch (first build only)
        if: github.event_name != 'pull_request' && matrix.php-version == '8.4'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STOCKLAND_ERP_16.1.90_CANONICAL_WORDPRESS_UPDATE.zip STOCKLAND_ERP_16.1.90_CANONICAL_WORDPRESS_UPDATE.zip.sha256 STOCKLAND_ERP_16.1.90_LOCAL_QA_RESULTS.txt STOCKLAND_ERP_16.1.90_PHPCBF.log
          git commit -m "Build canonical Stockland ERP 16.1.90 WordPress update"
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD
