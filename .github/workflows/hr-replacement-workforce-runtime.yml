name: Stockland HR replacement workforce vertical slice

on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/hr_payroll_replacement_runtime/**'
      - 'ci/qa/test_hr_replacement_workforce_service.php'
      - 'ci/qa/test_hr_replacement_workforce_rest_contract.py'
      - '.github/workflows/hr-replacement-workforce-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'ci/hr_payroll_replacement_runtime/**'
      - 'ci/qa/test_hr_replacement_workforce_service.php'
      - 'ci/qa/test_hr_replacement_workforce_rest_contract.py'
      - '.github/workflows/hr-replacement-workforce-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stockland-hrx-workforce-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workforce-contract:
    name: Workforce vertical-slice contract / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - name: Checkout exact branch or pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up PHP runtime
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Lint every replacement runtime PHP file and synthetic harness
        shell: bash
        run: |
          set -euo pipefail
          find ci/hr_payroll_replacement_runtime -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l ci/qa/test_hr_replacement_workforce_service.php
          php -l ci/hr_payroll_candidate/Stockland_HR_Payroll_Calculator.php
          php -l ci/hr_payroll_candidate/Stockland_HR_Time_Leave_Engine.php
          php -l ci/hr_payroll_candidate/Stockland_HR_Workflow_State_Machine.php
      - name: Run 15-path REST authorization and idempotency contract
        run: python ci/qa/test_hr_replacement_workforce_rest_contract.py
      - name: Run synthetic workforce planning to vacancy opening flow
        run: php ci/qa/test_hr_replacement_workforce_service.php
      - name: Preserve independent calculator, transition and time/leave regression suites
        run: |
          php ci/hr_payroll_candidate/test_calculator.php
          php ci/hr_payroll_candidate/test_workflow_state_machine.php
          php ci/hr_payroll_candidate/test_time_leave_engine.php
