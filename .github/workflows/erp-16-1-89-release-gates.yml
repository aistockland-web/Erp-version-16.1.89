name: Stockland ERP 16.1.89 local release gates

on:
  push:
    branches:
      - main
      - "audit/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-installer:
    name: Validate exact 16.1.89 installer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — immutable SHA

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 — immutable SHA
        with:
          python-version: "3.12"

      - name: Set up PHP runtime for syntax validation
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2 — immutable SHA
        with:
          php-version: "8.4"
          coverage: none
          tools: none

      - name: Set up Node.js for JavaScript syntax validation
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 — immutable SHA
        with:
          node-version: "22"

      - name: Validate ZIP identity, package contract, source assets and syntax
        run: python ci/validate_release_16_1_89.py
