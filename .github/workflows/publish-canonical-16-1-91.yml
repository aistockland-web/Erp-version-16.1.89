name: Publish canonical Stockland ERP 16.1.91 installer

on:
  push:
    branches:
      - release/16.1.91-publish-installer

permissions:
  contents: write

concurrency:
  group: stockland-erp-16-1-91-publish-installer
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned workbook build dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'openpyxl==3.1.5'

      - name: Build from checksum-verified 16.1.90 baseline
        shell: bash
        run: |
          set -euo pipefail
          python ci/build_release_16_1_91.py
          python ci/qa/test-release-16.1.91.py

      - name: Require exact previously verified installer identity
        shell: bash
        run: |
          set -euo pipefail
          expected='e3dfe61dcbdfd382147407daca4ec32ed737dc35e5931d55d1ffbaf5a7337b34'
          actual="$(sha256sum STOCKLAND_ERP_16.1.91_CANONICAL_WORDPRESS_UPDATE.zip | cut -d ' ' -f1)"
          test "$actual" = "$expected"
          grep -F "$expected" STOCKLAND_ERP_16.1.91_CANONICAL_WORDPRESS_UPDATE.zip.sha256
          test -s STOCKLAND_ERP_16.1.91_LOCAL_QA_RESULTS.txt
          test -s STOCKLAND_ERP_16.1.91_DEEP_CODE_LEVEL_AUDIT.md
          unzip -t STOCKLAND_ERP_16.1.91_CANONICAL_WORDPRESS_UPDATE.zip

      - name: Commit canonical installer and audit receipt to this release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            STOCKLAND_ERP_16.1.91_CANONICAL_WORDPRESS_UPDATE.zip \
            STOCKLAND_ERP_16.1.91_CANONICAL_WORDPRESS_UPDATE.zip.sha256 \
            STOCKLAND_ERP_16.1.91_LOCAL_QA_RESULTS.txt \
            STOCKLAND_ERP_16.1.91_DEEP_CODE_LEVEL_AUDIT.md
          if git diff --cached --quiet; then
            echo 'Canonical package and QA receipts already match this branch.'
          else
            git commit -m 'Publish canonical Stockland ERP 16.1.91 installer'
            git push origin HEAD:release/16.1.91-publish-installer
          fi
