name: Reports explorer baseline extraction (audit only)

on:
  pull_request:
    branches: [main]
    paths:
      - 'ci/REPORTS_EXPLORER_16_1_93_ACCEPTANCE.md'
      - '.github/workflows/reports-explorer-source-inspection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-expose-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out isolated PR revision
        uses: actions/checkout@v4

      - name: Verify the exact audited 16.1.92 package
        shell: bash
        run: |
          set -euo pipefail
          test -f STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip
          test -f STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip.sha256
          sha256sum --check STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip.sha256
          python3 - <<'PY'
          import hashlib, zipfile
          from pathlib import Path
          p = Path("STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip")
          data = p.read_bytes()
          expected = "adec43b84f2b9a62d8913f84bad20588166800b2b6571d22d75abb86fcfd3fcd"
          assert hashlib.sha256(data).hexdigest() == expected, "Baseline checksum mismatch"
          assert len(data) == 1_113_446, "Baseline size mismatch"
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None, "ZIP CRC failure"
              names = [i.filename for i in z.infolist() if not i.is_dir()]
              assert len(names) == 75 and len(names) == len(set(names)), "Unexpected inventory"
              assert all(n.startswith("stockland-erp-app/") and ".." not in n.split("/") for n in names), "Unsafe ZIP path"
              required = {
                  "stockland-erp-app/assets/app.js",
                  "stockland-erp-app/includes/rest/class-rest-app.php",
                  "stockland-erp-app/RELEASE_MANIFEST.json",
              }
              assert required.issubset(names), "Required application source missing"
          print(f"PASS exact audited baseline: {len(names)} files, {len(data)} bytes, sha256={expected}")
          PY

      - name: Upload verified source baseline for isolated patching
        uses: actions/upload-artifact@v4
        with:
          name: stockland-erp-16.1.92-baseline-archive
          path: |
            STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip
            STOCKLAND_ERP_16.1.92_CANONICAL_WORDPRESS_UPDATE.zip.sha256
            STOCKLAND_ERP_16.1.92_DEEP_CODE_LEVEL_AUDIT.md
            STOCKLAND_ERP_16.1.92_LOCAL_QA_RESULTS.txt
          if-no-files-found: error
          retention-days: 7
