name: Stockland ERP 16.2.9 HR policies, secure downloads, cart validation and icon CSS candidate

on:
  push:
    branches:
      - "feature/hr-payroll-full-cycle-16-2-0"
    paths:
      - "ci/build_full_hr_payroll_16_2_0.py"
      - "ci/hr_payroll_overlay_16_2_0/**"
      - "ci/qa/test_full_hr_payroll_16_2_0.py"
      - "ci/qa/test_pos_cart_ui_synthetic.js"
      - "ci/qa/check-css-postcss.js"
      - "ci/qa/test_audit_chain_synthetic.php"
      - "ci/cssqa/**"
      - ".github/workflows/hr-payroll-full-cycle-16-2-0.yml"
  pull_request:
    branches: [main]
    paths:
      - "ci/build_full_hr_payroll_16_2_0.py"
      - "ci/hr_payroll_overlay_16_2_0/**"
      - "ci/qa/test_full_hr_payroll_16_2_0.py"
      - "ci/qa/test_pos_cart_ui_synthetic.js"
      - "ci/qa/check-css-postcss.js"
      - "ci/qa/test_audit_chain_synthetic.php"
      - "ci/cssqa/**"
      - ".github/workflows/hr-payroll-full-cycle-16-2-0.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stockland-hr-payroll-16-2-0-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-and-php:
    name: Build exact 16.2.9 source-locked candidate (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.3", "8.4"]
    steps:
      - name: Checkout exact candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Download canonical locked 16.1.95 source installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: STOCKLAND-ERP-16.1.95-Cumulative-WordPress-Update
          repository: aistockland-web/Erp-version-16.1.89
          run-id: 40036018031
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/stockland-16.1.95-source
      - name: Verify source archive SHA and structure
        shell: bash
        run: |
          set -euo pipefail
          BASELINE="$RUNNER_TEMP/stockland-16.1.95-source/STOCKLAND_ERP_16.1.95_CANONICAL_WORDPRESS_UPDATE.zip"
          test -s "$BASELINE"
          echo "494e777247508d009dfdb216c9607bb1bc96717197e94a0e8ad3459b7cc81625  $BASELINE" | sha256sum --check -
          unzip -t "$BASELINE"
          echo "BASELINE=$BASELINE" >> "$GITHUB_ENV"
      - name: Compile build script and QA sources
        run: python -m py_compile ci/build_full_hr_payroll_16_2_0.py ci/qa/test_full_hr_payroll_16_2_0.py
      - name: Build deterministic candidate package
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/stockland-16.2.9"
          python ci/build_full_hr_payroll_16_2_0.py --input "$BASELINE" --output "$RUNNER_TEMP/stockland-16.2.9/STOCKLAND_ERP_16.2.9_HR_PAYROLL_CANDIDATE.zip"
      - name: Run package-level acceptance tests
        run: python ci/qa/test_full_hr_payroll_16_2_0.py "$RUNNER_TEMP/stockland-16.2.9/STOCKLAND_ERP_16.2.9_HR_PAYROLL_CANDIDATE.zip"
      - name: Lint every PHP file in the exact generated installer
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/stockland-16.2.9/extracted"
          mkdir -p "$OUT"
          unzip -q "$RUNNER_TEMP/stockland-16.2.9/STOCKLAND_ERP_16.2.9_HR_PAYROLL_CANDIDATE.zip" -d "$OUT"
          find "$OUT/stockland-erp-app" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check "$OUT/stockland-erp-app/assets/app.js"
          node --check "$OUT/stockland-erp-app/assets/pwa.js"
          node --check ci/hr_payroll_overlay_16_2_0/hr-lifecycle-ui.js
          node --check ci/hr_payroll_overlay_16_2_0/pos-cart-ui.js
      - name: Test POS cart edited-input validation (synthetic only)
        run: node ci/qa/test_pos_cart_ui_synthetic.js ci/hr_payroll_overlay_16_2_0/pos-cart-ui.js
      - name: Test independent POS VAT money and COGS fixtures (synthetic only)
        run: php ci/qa/test_pos_finance_inventory_16_2_4.php "$RUNNER_TEMP/stockland-16.2.9/extracted/stockland-erp-app"
      - name: Install locked PostCSS parser for exact package validation
        run: npm ci --prefix ci/cssqa --ignore-scripts --no-audit --no-fund
      - name: Validate ordered CSS modules, Bootstrap asset hash and compiled stylesheet
        env:
          NODE_PATH: ${{ github.workspace }}/ci/cssqa/node_modules
          STOCKLAND_APP: ${{ runner.temp }}/stockland-16.2.9/extracted/stockland-erp-app
        run: node ci/qa/check-css-postcss.js "$STOCKLAND_APP" --scope release-candidate
      - name: Verify audit-chain hash and continuity behavior with synthetic records
        env:
          STOCKLAND_APP: ${{ runner.temp }}/stockland-16.2.9/extracted/stockland-erp-app
        run: php ci/qa/test_audit_chain_synthetic.php "$STOCKLAND_APP"
      - name: Test pure payroll calculator with synthetic-only fixtures
        run: php ci/hr_payroll_overlay_16_2_0/test-calculator-overlay.php
      - name: Install locked PHPCS/WPCS dependencies
        env:
          COMPOSER_ALLOW_SUPERUSER: "1"
        run: |
          set -euo pipefail
          composer validate --working-dir=ci/phpcs --strict
          composer install --working-dir=ci/phpcs --no-interaction --prefer-dist --no-progress
          composer audit --working-dir=ci/phpcs --locked --format=table
      - name: Run PHPCS/WPCS source-aware gate on exact 16.2.9 installer
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/stockland-16.2.9/extracted/stockland-erp-app"
          REPORT="$RUNNER_TEMP/stockland-16.2.9/phpcs-results-${{ matrix.php-version }}.json"
          set +e
          ci/phpcs/vendor/bin/phpcs --standard=ci/qa/stockland-phpcs.xml --extensions=php --report=json --report-file="$REPORT" "$APP"
          code=$?
          set -e
          test -s "$REPORT"
          echo "PHPCS exit code: $code (source-aware security gate determines release-blocking findings)"
          python ci/qa/test-phpcs-security-review.py "$APP" "$REPORT"
      - name: Install pinned Semgrep CLI for exact candidate source
        run: python -m pip install --disable-pip-version-check 'pydantic==2.12.5' 'semgrep==1.139.0'
      - name: Run Semgrep PHP/security-audit rules on exact 16.2.9 installer
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/stockland-16.2.9/extracted/stockland-erp-app"
          REPORT="$RUNNER_TEMP/stockland-16.2.9/semgrep-results-${{ matrix.php-version }}.json"
          semgrep scan --metrics=off --config p/php --config p/security-audit --include '*.php' --json --output "$REPORT" "$APP"
          PHP_COUNT="$(find "$APP" -type f -name '*.php' | wc -l | tr -d ' ')"
          test "$PHP_COUNT" -gt 0
          python ci/qa/summarize-semgrep.py "$REPORT" --expected-targets "$PHP_COUNT"
      - name: Verify candidate receipt, no-production-write and fail-closed manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, zipfile
          p=os.path.join(os.environ["RUNNER_TEMP"],"stockland-16.2.9","STOCKLAND_ERP_16.2.9_HR_PAYROLL_CANDIDATE.zip")
          receipt_path=os.path.join(os.environ["RUNNER_TEMP"],"stockland-16.2.9","STOCKLAND_ERP_16.2.9_HR_PAYROLL_CANDIDATE.receipt.json")
          digest=hashlib.sha256(open(p,"rb").read()).hexdigest()
          receipt=json.load(open(receipt_path,encoding="utf-8"))
          with zipfile.ZipFile(p) as z:
              actual=[i.filename for i in z.infolist() if not i.is_dir()]
              m=json.loads(z.read("stockland-erp-app/RELEASE_MANIFEST.json"))
              assert len(actual)==87 and len(set(actual))==87
              assert receipt.get("runtime_file_count")==len(actual), "build receipt runtime file count mismatches installer"
              assert receipt.get("installer_sha256")==digest, "build receipt installer SHA-256 mismatch"
              assert m.get("schema_contract_status") == "PROVISIONAL_CANDIDATE_NOT_ARCHITECTURE_APPROVAL"
              assert m.get("statutory_rates_or_exemption_caps_seeded") is False
              assert m.get("private_vault_required_outside_webroot") is True
              assert m.get("social_reporting_mode") == "MANUAL_EXPORT_TIMESTAMPED_NOT_REALTIME"
              assert receipt.get("production_ready") is False
              assert receipt.get("schema_contract_approved") is False
              assert receipt.get("production_database_touched") is False
              assert receipt.get("wordpress_activated") is False
          print("candidate_sha256="+digest+" runtime_files="+str(len(actual)))
          PY
      - name: Publish candidate artifact and build evidence (PHP 8.3 job only)
        if: matrix.php-version == '8.3'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: STOCKLAND-ERP-16.2.9-HR-PAYROLL-CANDIDATE
          path: |
            ${{ runner.temp }}/stockland-16.2.9/STOCKLAND_ERP_16.2.9_HR_PAYROLL_CANDIDATE.zip
            ${{ runner.temp }}/stockland-16.2.9/STOCKLAND_ERP_16.2.9_HR_PAYROLL_CANDIDATE.sha256
            ${{ runner.temp }}/stockland-16.2.9/STOCKLAND_ERP_16.2.9_HR_PAYROLL_CANDIDATE.receipt.json
            ${{ runner.temp }}/stockland-16.2.9/phpcs-results-8.3.json
            ${{ runner.temp }}/stockland-16.2.9/semgrep-results-8.3.json
          if-no-files-found: error
          retention-days: 30
