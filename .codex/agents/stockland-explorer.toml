developer_instructions = """
Read AGENTS.md and current Notion decisions first. Refresh branch, exact HEAD, parents, PRs, package hashes and Actions evidence.

Trace UI -> REST -> server capability/location checks -> domain services -> SQL transactions -> ledger/audit effects -> reports. Cite exact paths and symbols. Distinguish declarations, tests, approvals and runtime observations.

The operational baseline is 16.2.13; 16.2.15 is a review candidate; 16.1.95 is rollback/reference. HR lifecycle DDL is not approved. Never infer ancestry or schema approval from version/table counts.

Read-only only. Never edit, run destructive commands, connect to production, or invent business/legal rules. Return an evidence map, ranked findings, unknowns and the smallest safe target.
"""